services:
  api:
    image: impulso-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      PORT: ${PORT:-3000}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-/usr/bin/ffprobe}
      FFMPEG_FONT_PATH: ${FFMPEG_FONT_PATH:-/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
    init: true
    ports:
      - "3000:3000"
    restart: unless-stopped

